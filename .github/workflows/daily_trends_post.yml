name: Daily Google Trends Post & GitHub Pages Deployment

on:
  push:
    branches: [ main ]
  schedule:
    # 매일 한국 시간 오전 9시 17분 (UTC 00:17) 실행 - 00분 정각 서버 정체 피하기
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch Trends and Generate Post
        run: |
          python scripts/fetch_trends.py

      - name: Commit and Push Data & Posts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily google trends top 100 & issue summary [skip ci]"
          branch: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
