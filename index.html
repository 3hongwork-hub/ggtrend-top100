<!-- 구글 트렌드 상위 100개 검색어 및 이슈 요약 대시보드 메인 HTML 구조 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Trends Top 100 & Issue Summary | 실시간 구글 트렌드 인기 검색어 100</title>
  <meta name="description" content="매일 자동 업데이트되는 대한민국 및 글로벌 구글 인기 검색 순위 상위 100개 및 주요 뉴스 이슈 요약본을 확인하세요.">
  <link rel="stylesheet" href="css/style.css?v=1.1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo-group">
        <div class="logo-badge">🔥</div>
        <div class="logo-title">Trends Top 100 <span class="header-date" id="header-date"></span></div>
      </div>
      <div class="controls-group">
        <div class="date-select-box">
          <span class="date-icon">📅</span>
          <div class="date-select-group">
            <select id="select-year" aria-label="연도 선택">
              <option value="">----년</option>
            </select>
            <select id="select-month" aria-label="월 선택">
              <option value="">--월</option>
            </select>
            <select id="select-day" aria-label="일 선택">
              <option value="">--일</option>
            </select>
          </div>
        </div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="키워드 또는 이슈 검색..." aria-label="검색어 입력">
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="hero-banner">
      <div class="hero-header">
        <div>
          <h1 class="hero-title">📈 <span id="hero-date">오늘의</span> 구글 트렌드 Top 100 & 이슈 요약</h1>
          <p class="hero-desc">구글 인기 검색어 100개의 실시간 순위와 주요 관련 뉴스 요약본을 제공합니다.</p>
        </div>
        <div class="update-time" id="update-time">업데이트 확인 중...</div>
      </div>
    </section>

    <section class="grid-container" id="grid-container">
      <!-- JavaScript will dynamically render trend cards here -->
    </section>
  </main>

  <!-- Detail Summary Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="modal-close" aria-label="닫기">&times;</button>
      <h2 class="modal-title" id="modal-title">키워드 제목</h2>
      <div style="font-size: 0.85rem; color: #818cf8; font-weight: 600;" id="modal-traffic">검색량</div>
      
      <div style="margin-top: 1.5rem; font-weight: 700; font-size: 1rem; color: #a855f7;">💡 주요 이슈 요약</div>
      <div class="modal-summary-box" id="modal-summary">요약 내용</div>

      <div style="margin-top: 1.5rem; font-weight: 700; font-size: 1rem; color: #a855f7; margin-bottom: 0.8rem;">📰 관련 뉴스 기사</div>
      <div id="modal-news-list">
        <!-- Dynamic news links -->
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 Google Trends Top 100 Agent. Automated with GitHub Actions.</p>
  </footer>

  <script src="js/app.js?v=1.2"></script>
</body>
</html>
